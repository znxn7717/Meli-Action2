name: Convert MP4 to MP3

on:
  workflow_dispatch:
    inputs:
      video_url_1:
        description: "Direct MP4 link 1 (required)"
        required: true
        type: string
      video_url_2:
        description: "Direct MP4 link 2 (optional)"
        required: false
        type: string
      video_url_3:
        description: "Direct MP4 link 3 (optional)"
        required: false
        type: string
      video_url_4:
        description: "Direct MP4 link 4 (optional)"
        required: false
        type: string
      video_url_5:
        description: "Direct MP4 link 5 (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run converter
        run: |
          urls=()
          urls+=("${{ github.event.inputs.video_url_1 }}")

          if [ -n "${{ github.event.inputs.video_url_2 }}" ]; then
            urls+=("${{ github.event.inputs.video_url_2 }}")
          fi

          if [ -n "${{ github.event.inputs.video_url_3 }}" ]; then
            urls+=("${{ github.event.inputs.video_url_3 }}")
          fi

          if [ -n "${{ github.event.inputs.video_url_4 }}" ]; then
            urls+=("${{ github.event.inputs.video_url_4 }}")
          fi

          if [ -n "${{ github.event.inputs.video_url_5 }}" ]; then
            urls+=("${{ github.event.inputs.video_url_5 }}")
          fi

          python scripts/mp4_to_mp3_converter.py "${urls[@]}"

      - name: Commit and push output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add downloads/*.mp3

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add converted MP3 files"
          git push origin HEAD:main
